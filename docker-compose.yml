services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: litradesa_db
    environment:
      POSTGRES_DB: litradesa
      POSTGRES_USER: litradesa_user
      POSTGRES_PASSWORD: litradesa_password
    volumes:
      - litradesa_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - litradesa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litradesa_user -d litradesa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: litradesa_redis
    ports:
      - "6379:6379"
    volumes:
      - litradesa_redis_data:/data
    networks:
      - litradesa_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Application
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    container_name: litradesa_app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=litradesa
      - DB_USERNAME=litradesa_user
      - DB_PASSWORD=litradesa_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - litradesa_network

  # Nginx Web Server
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: litradesa_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html
      - ./docker/web/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/web/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - litradesa_network

  # Laravel Reverb WebSocket Server
  reverb:
    build:
      context: .
      dockerfile: docker/reverb/Dockerfile
    container_name: litradesa_reverb
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    ports:
      - "8080:8080"
    environment:
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    depends_on:
      - app
      - redis
    networks:
      - litradesa_network
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  # Node.js for Frontend Development
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: litradesa_node
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_REVERB_HOST=localhost
      - VITE_REVERB_PORT=8080
    command: npm run dev -- --host 0.0.0.0
    networks:
      - litradesa_network

networks:
  litradesa_network:
    driver: bridge

volumes:
  litradesa_db_data:
  litradesa_redis_data:

